<div id="admin-management-page" class="page-content fade-in">
    <div class="glass-card p-8">
        <h2 class="text-3xl font-bold text-white mb-6 text-center">👥 Gerenciar Usuários</h2>
        <div class="mb-8 p-6 bg-green-500/10 rounded-xl border border-green-500/20">
            <h3 class="text-2xl font-semibold text-white mb-4">➕ Adicionar Novo Usuário</h3>
            <form id="admin-add-user-form" class="space-y-4">
                <input type="text" id="admin-add-nome" placeholder="Nome Completo" class="input-glass w-full" required>
                <input type="email" id="admin-add-email" placeholder="E-mail" class="input-glass w-full" required>
                <input type="password" id="admin-add-password" placeholder="Senha (6-8 caracteres)" class="input-glass w-full" required minlength="6" maxlength="8">
                <select id="admin-add-tipo" class="select-glass w-full" required>
                    <option value="">Tipo de Usuário...</option>
                    <option value="aluno">Aluno</option>
                    <option value="professor">Professor</option>
                    <option value="funcionarioEsuda">Funcionário Esuda</option>
                    <option value="comunidadeExterna">Comunidade Externa</option>
                </select>
                <button type="submit" class="btn-glass-secondary w-full text-white py-3 rounded-xl font-semibold">Cadastrar</button>
            </form>
        </div>
        <div>
            <h3 class="text-2xl font-semibold text-white mb-4">📋 Lista de Usuários (<span id="user-count">0</span>)</h3>
            <div class="overflow-x-auto glass-table">
                <table class="min-w-full divide-y divide-white/10">
                    <thead class="bg-green-500/20">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase">Nome</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase">E-mail</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase">Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase">Moedas</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-list-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
